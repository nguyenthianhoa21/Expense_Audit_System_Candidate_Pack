services:
  db:
    image: postgres:16-alpine
    container_name: expense_audit_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: expense_audit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d expense_audit"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: expense_audit_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://audit:audit@db:5432/expense_audit
      STORAGE_PATH: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data

  frontend:
    build: ./frontend
    container_name: expense_audit_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:80"

volumes:
  pgdata:
  backend_data:
